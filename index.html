<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff5f8"><title>心动派对 · iPhone版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0f4;color:#282337;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer}#app{max-width:460px;margin:auto;min-height:100vh;background:#fff9fb;padding-bottom:calc(78px + env(safe-area-inset-bottom))}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:white}.brand{font-size:22px;font-weight:800}.pink{color:#f94f88}.pill{background:#ffe8f0;color:#ed3d78;border-radius:20px;padding:8px 13px;font-size:12px}.content{padding:20px}.hint{color:#958b98;font-size:13px;line-height:1.6}h2{font-size:23px;margin:0 0 5px}.deck{height:min(60vh,520px);min-height:360px;position:relative;margin-top:18px}.profile-card{position:absolute;inset:0;border-radius:26px;overflow:hidden;box-shadow:0 15px 38px #af5c8533;touch-action:pan-y;user-select:none}.art{height:100%;display:flex;align-items:center;justify-content:center;font-size:124px;background:linear-gradient(140deg,var(--a),var(--b))}.card-bottom{position:absolute;bottom:0;left:0;right:0;padding:65px 23px 24px;color:white;background:linear-gradient(transparent,#211428c9)}.card-bottom h2{font-size:31px}.tag{display:inline-block;background:#ffffff38;border:1px solid #ffffff33;border-radius:30px;padding:6px 10px;margin:4px 4px 0 0;font-size:12px}.actions{display:flex;justify-content:center;gap:24px;margin:22px}.round{width:64px;height:64px;border-radius:50%;background:white;box-shadow:0 7px 20px #dfb7c344;font-size:29px}.like{color:#f84c85}.nope{color:#999}.super{color:#f5a52a}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;display:flex;justify-content:space-around;background:white;border-top:1px solid #f4e8ee;padding:11px 0 calc(12px + env(safe-area-inset-bottom));z-index:10}.nav button{background:transparent;color:#9b92a0;font-size:12px;display:grid;gap:4px;justify-items:center}.nav button.active{color:#f94f88;font-weight:700}.nav .ico{font-size:23px}.box{background:white;border:1px solid #f6e9ef;border-radius:18px;padding:15px;margin:13px 0}.person{display:flex;align-items:center;gap:13px}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:29px;flex-shrink:0;background:linear-gradient(135deg,var(--a),var(--b))}.grow{flex:1}.name{font-weight:750}.small{font-size:12px;color:#958b98;margin-top:5px}.primary{background:linear-gradient(90deg,#ff6296,#f33e80);color:white;padding:13px 19px;border-radius:15px;font-weight:700}.outline{background:#fff0f5;color:#e9437b;padding:12px;border-radius:12px}.wide{width:100%}input,textarea{width:100%;border:1px solid #eadfe6;border-radius:12px;padding:12px;background:white;color:#282337;outline-color:#f94f88}label{display:block;font-size:13px;color:#766d7a;margin:14px 0 6px}.empty{text-align:center;padding:75px 20px;color:#a29aa6}.empty .emoji{font-size:60px}.chatlog{height:calc(100dvh - 245px);min-height:250px;overflow:auto;padding:12px 0}.bubble{max-width:79%;padding:11px 14px;border-radius:16px;margin:9px 0;line-height:1.5;font-size:14px;word-break:break-word}.mine{background:#ff6497;color:white;margin-left:auto;border-bottom-right-radius:4px}.theirs{background:white;border:1px solid #f2e5eb;border-bottom-left-radius:4px}.sendbar{display:flex;gap:8px}.sendbar input{flex:1;min-width:0}.overlay{position:fixed;inset:0;background:#2615279c;z-index:20;display:grid;place-items:center;padding:25px}.modal{background:white;border-radius:25px;padding:27px;width:min(100%,360px);text-align:center}.muted{color:#958b98}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.note{background:#fff0f5;color:#ab4971;padding:12px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:12px}
</style></head><body><div id="app"><div class="top"><div class="brand">💗 心动<span class="pink">派对</span></div><span class="pill">18+ 演示版</span></div><main id="main" class="content"><h2>发现心动</h2><p class="hint">正在加载…</p></main><nav class="nav" id="nav"></nav></div><script>
(function(){'use strict';
var people=[{id:1,n:'小鹿',age:24,city:'上海',bio:'喜欢旅行、咖啡和日落',tags:['摄影','周末徒步'],emoji:'👩🏻',a:'#ffb8ca',b:'#a486e9'},{id:2,n:'可可',age:26,city:'杭州',bio:'希望遇见能一起认真生活的人',tags:['烘焙','电影'],emoji:'👩🏽',a:'#ffcfab',b:'#ff8ea7'},{id:3,n:'阿哲',age:27,city:'深圳',bio:'工作认真，生活有趣',tags:['健身','宠物'],emoji:'👨🏻',a:'#a2d5ff',b:'#9c9eea'},{id:4,n:'晴晴',age:25,city:'成都',bio:'想找一个聊得来的人',tags:['音乐','美食'],emoji:'👩🏼',a:'#ffc4a1',b:'#d78cc9'},{id:5,n:'小宇',age:29,city:'北京',bio:'爱运动，也爱宅家做饭',tags:['跑步','做饭'],emoji:'👨🏽',a:'#a3e6da',b:'#8ab4e7'}];
var key='xindong_iphone_v2',data={index:0,liked:[],matches:[],chats:{},me:{name:'心动新人',age:'25',city:'上海',bio:'期待一场美好的相遇'}};try{var saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object')data=Object.assign(data,saved)}catch(e){};
var page='discover',chatId=null,main=document.getElementById('main'),nav=document.getElementById('nav');function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function p(id){return people.find(function(x){return x.id===id})}function av(x){return '<div class="avatar" style="--a:'+x.a+';--b:'+x.b+'">'+x.emoji+'</div>'}function setPage(v){page=v;chatId=null;render()}function renderNav(){var tabs=[['discover','💞','发现'],['likes','💗','喜欢'],['messages','💬','消息'],['me','👤','我的']];nav.innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(page===t[0]?'active':'')+'"><span class="ico">'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
function render(){renderNav();if(page==='discover')discover();else if(page==='likes')likes();else if(page==='messages')messages();else me()}
function discover(){var x=people[data.index];if(!x){main.innerHTML='<h2>发现心动 ✨</h2><div class="empty"><div class="emoji">💞</div><h2>今天已经看完啦</h2><p>演示用户已浏览完毕</p><button class="primary" id="again">重新开始</button></div>';document.getElementById('again').onclick=function(){data.index=0;save();render()};return}main.innerHTML='<h2>发现心动 ✨</h2><div class="hint">左滑跳过 · 右滑喜欢（也可点击按钮）</div><div class="deck"><div class="profile-card" id="swipe"><div class="art" style="--a:'+x.a+';--b:'+x.b+'">'+x.emoji+'</div><div class="card-bottom"><h2>'+esc(x.n)+'，'+x.age+'</h2><div>📍 '+esc(x.city)+' · '+esc(x.bio)+'</div><div>'+x.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div></div></div></div><div class="actions"><button class="round nope" id="pass" aria-label="跳过">✕</button><button class="round super" id="star" aria-label="特别喜欢">★</button><button class="round like" id="like" aria-label="喜欢">♥</button></div><div class="note">所有人物均为虚构演示资料，头像为表情图案；匹配与聊天只保存在本机。</div>';document.getElementById('pass').onclick=function(){vote(false)};document.getElementById('like').onclick=function(){vote(true)};document.getElementById('star').onclick=function(){vote(true)};var el=document.getElementById('swipe'),sx=null;el.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>65)vote(d>0)},{passive:true})}
function vote(yes){var x=people[data.index];if(!x)return;data.index++;if(yes){if(data.liked.indexOf(x.id)<0)data.liked.push(x.id);if(x.id===1||x.id===3||x.id===5){if(data.matches.indexOf(x.id)<0)data.matches.push(x.id);save();render();showMatch(x);return}}save();render()}
function showMatch(x){var ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal"><div style="font-size:62px">💖</div><h2>匹配成功！</h2><p class="muted">你和 '+esc(x.n)+' 互相喜欢了（演示）</p><button class="primary wide" id="startchat">开始聊天</button><button class="outline wide" style="margin-top:10px" id="closemodal">继续探索</button></div>';document.body.appendChild(ov);ov.querySelector('#closemodal').onclick=function(){ov.remove()};ov.querySelector('#startchat').onclick=function(){ov.remove();page='messages';chatId=x.id;render()}}
function likes(){main.innerHTML='<h2>我喜欢的 💗</h2><p class="hint">已喜欢 '+data.liked.length+' 位演示用户</p>'+(data.liked.length?data.liked.map(function(id){var x=p(id);return '<div class="box person">'+av(x)+'<div class="grow"><div class="name">'+esc(x.n)+'，'+x.age+'</div><div class="small">'+esc(x.city)+' · '+esc(x.bio)+'</div></div><span class="pink">♥</span></div>'}).join(''):'<div class="empty"><div class="emoji">💗</div>还没有喜欢的人，去发现看看吧</div>')}
function messages(){if(chatId!==null){chatView();return}main.innerHTML='<h2>消息 💬</h2><p class="hint">只有互相喜欢才能开启演示聊天</p>'+(data.matches.length?data.matches.map(function(id){var x=p(id),arr=data.chats[id]||[];return '<div class="box person" data-chat="'+id+'">'+av(x)+'<div class="grow"><div class="name">'+esc(x.n)+'</div><div class="small">'+esc(arr.length?arr[arr.length-1].text:'点击开始聊天')+'</div></div><span class="pink">›</span></div>'}).join(''):'<div class="empty"><div class="emoji">💬</div>还没有匹配成功的用户</div>');main.querySelectorAll('[data-chat]').forEach(function(el){el.onclick=function(){chatId=Number(el.getAttribute('data-chat'));render()}})}
function chatView(){var x=p(chatId),arr=data.chats[chatId]||[];main.innerHTML='<div class="row"><button class="outline" id="back">‹ 返回</button><strong>'+esc(x.n)+' · 演示聊天</strong></div><div class="chatlog" id="log"><div class="bubble theirs">你好呀，很高兴认识你！👋（模拟消息）</div>'+arr.map(function(m){return '<div class="bubble '+(m.mine?'mine':'theirs')+'">'+esc(m.text)+'</div>'}).join('')+'</div><form id="send" class="sendbar"><input id="msg" maxlength="300" placeholder="说点什么…" autocomplete="off"><button class="primary" type="submit">发送</button></form><div class="hint" style="margin-top:12px">此处仅为本机聊天模拟，不会发送给真人。</div>';document.getElementById('back').onclick=function(){chatId=null;render()};document.getElementById('send').onsubmit=function(e){e.preventDefault();var el=document.getElementById('msg'),t=el.value.trim();if(!t)return;if(!data.chats[chatId])data.chats[chatId]=[];data.chats[chatId].push({mine:true,text:t});save();chatView()};document.getElementById('log').scrollTop=999999}
function me(){var m=data.me;main.innerHTML='<h2>个人中心 👤</h2><p class="hint">编辑自己的演示资料</p><div class="box"><label>昵称</label><input id="nm" maxlength="20" value="'+esc(m.name)+'"><label>年龄（仅限18岁以上）</label><input id="age" type="number" min="18" max="100" value="'+esc(m.age)+'"><label>城市</label><input id="city" maxlength="30" value="'+esc(m.city)+'"><label>个人介绍</label><textarea id="bio" rows="3" maxlength="200">'+esc(m.bio)+'</textarea><button class="primary wide" id="save">保存资料</button></div><div class="box"><div class="row"><strong>💎 心动会员</strong><span class="pill">展示功能</span></div><p class="hint">更多曝光、优先展示等会员权益仅为产品概念，暂不收费。</p><button class="outline wide" id="vip">了解会员</button></div><div class="box"><strong>🛡️ 安全与隐私</strong><p class="hint">正式上线需要年龄验证、举报审核、反诈骗机制和隐私保护。当前所有数据仅保存在此浏览器。</p><button class="outline wide" id="reset">清空演示数据</button></div>';document.getElementById('save').onclick=function(){var age=Number(document.getElementById('age').value);if(!Number.isFinite(age)||age<18||age>100){alert('仅支持18至100岁');return}data.me={name:document.getElementById('nm').value.trim()||'心动新人',age:String(age),city:document.getElementById('city').value.trim(),bio:document.getElementById('bio').value.trim()};save();alert('保存成功')};document.getElementById('vip').onclick=function(){alert('这是会员功能演示，尚未接入支付。')};document.getElementById('reset').onclick=function(){if(confirm('确定清空所有演示数据吗？')){try{localStorage.removeItem(key)}catch(e){}location.reload()}}}
nav.addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)setPage(b.getAttribute('data-tab'))});render();
})();
</script></body></html>
